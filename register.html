<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Athlete & Coach Registration | STACKLY Sports Academy</title>
  <meta name="description" content="Register an athlete or coaching profile at STACKLY Sports Academy for season admissions and trials.">
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/responsive.css">
</head>
<body style="min-height:100vh; display:flex; flex-direction:column; background:radial-gradient(circle at 20% 20%, rgba(198,255,0,0.06) 0%, transparent 50%), var(--bg-dark);">

  <!-- Reading Scroll Progress Bar -->
  <div id="scroll-progress"></div>

  <!-- Top Header -->
  <header style="padding:1.5rem 2rem; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--border-color); background:var(--bg-surface);">
    <a href="index.html" class="nav-logo">
      <img src="./images/logo-dark.webp" alt="STACKLY Logo" class="nav-logo-img">
    </a>

    <a href="index.html" class="btn btn-outline btn-sm" style="display:inline-flex; align-items:center; gap:0.5rem;">
      <span class="material-symbols-outlined">arrow_back</span>
      <span>Back To Home</span>
    </a>
  </header>

  <!-- Register Form Container -->
  <main style="flex-grow:1; display:flex; align-items:center; justify-content:center; padding:3rem 1.5rem;">
    <div style="background:var(--bg-card); border:1px solid var(--border-color); border-radius:var(--radius-lg); padding:2.5rem; width:100%; max-width:540px; box-shadow:var(--shadow-lg); position:relative;">
      
      <div style="text-align:center; margin-bottom:2rem;">
        <div class="section-tag" style="margin-bottom:0.75rem;">Join The Academy</div>
        <h1 style="font-family:var(--font-heading); font-size:2.2rem; color:var(--text-pure); text-transform:uppercase; letter-spacing:1px;">
          CREATE <span>ACCOUNT</span>
        </h1>
        <p style="color:var(--text-secondary); font-size:0.9rem; margin-top:0.35rem;">
          Register as an athlete or coach to manage evaluations and bookings.
        </p>
      </div>

      <form id="registerForm" novalidate>
        <!-- Role Selection -->
        <div class="form-group" style="margin-bottom:1.25rem;">
          <label for="role">
            <span class="material-symbols-outlined">badge</span>
            <span>Account Role</span>
          </label>
          <select id="role" name="role" required class="form-select">
            <option value="user" selected>Athlete / Student</option>
            <option value="admin">Coach / Academy Staff</option>
          </select>
        </div>

        <!-- Full Name -->
        <div class="form-group" style="margin-bottom:1.25rem;">
          <label for="name">
            <span class="material-symbols-outlined">person</span>
            <span>Full Name</span>
          </label>
          <input type="text" id="name" name="name" required placeholder="e.g. Jordan Miller" class="form-control">
        </div>

        <div class="dash-form-grid" style="margin-bottom:1.25rem;">
          <!-- Email -->
          <div class="form-group">
            <label for="email">
              <span class="material-symbols-outlined">mail</span>
              <span>Email Address</span>
            </label>
            <input type="email" id="email" name="email" required placeholder="jordan@example.com" class="form-control">
          </div>

          <!-- Phone -->
          <div class="form-group">
            <label for="phone">
              <span class="material-symbols-outlined">call</span>
              <span>Phone Number</span>
            </label>
            <input type="tel" id="phone" name="phone" required placeholder="+1 (555) 000-0000" class="form-control">
          </div>
        </div>

        <div class="dash-form-grid" style="margin-bottom:1.5rem;">
          <!-- Password -->
          <div class="form-group">
            <label for="password">
              <span class="material-symbols-outlined">lock</span>
              <span>Password</span>
            </label>
            <input type="password" id="password" name="password" required placeholder="Min 6 chars" class="form-control">
          </div>

          <!-- Confirm Password -->
          <div class="form-group">
            <label for="confirmPassword">
              <span class="material-symbols-outlined">lock_reset</span>
              <span>Confirm Password</span>
            </label>
            <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="Re-type password" class="form-control">
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn btn-primary" style="width:100%; height:48px; margin-bottom:1.25rem;">
          <span class="material-symbols-outlined">how_to_reg</span>
          <span>Create Account</span>
        </button>

        <!-- Existing account link -->
        <div style="text-align:center; font-size:0.9rem; color:var(--text-secondary);">
          Already have an account? 
          <a href="login.html" style="color:var(--accent-volt); font-weight:700; margin-left:0.3rem;">Login Here</a>
        </div>
      </form>

    </div>
  </main>

  <footer style="padding:1.5rem; text-align:center; font-size:0.8rem; color:var(--text-muted); border-top:1px solid var(--border-color); background:var(--bg-surface);">
    &copy; 2026 STACKLY Sports Academy. All rights reserved.
  </footer>

  <script src="./js/main.js"></script>
  <script src="./js/auth.js"></script>
</body>
</html>
